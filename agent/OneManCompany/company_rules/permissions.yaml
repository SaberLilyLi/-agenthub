default: allow
rules:
  - match: {tool: "write", target_exists: true, owner_is_self: false}
    action: reject
    reason: "不能覆盖其他员工拥有的文件"
  - match: {tool: "external_api"}
    action: reject
    reason: "外部 API 调用需要获得明确的策略许可"
  - match: {cost_usd_gt: 10.0}
    action: reject
    reason: "单次操作超过预算阈值"
