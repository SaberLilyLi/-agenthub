id: gmail
name: Gmail
description: >
  通过 Google API 访问 Gmail，可搜索、阅读和发送邮件、创建草稿并管理标签。
  使用 OAuth 2.0 认证，首次使用时会弹出 OAuth 窗口，请 CEO 授权。
  重要：Gmail 仅用于与客户、供应商和合作伙伴等外部对象沟通。
  禁止使用 Gmail 分派内部任务或协调员工，此类操作请使用 dispatch_child()。
  禁止使用 Gmail 联系 CEO，请使用 report_to_ceo()。
added_by: CEO
sprite: desk_equipment
type: langchain_module
oauth:
  service_name: gmail
  authorize_url: https://accounts.google.com/o/oauth2/v2/auth
  token_url: https://oauth2.googleapis.com/token
  scopes: https://www.googleapis.com/auth/gmail.modify
  client_id_env: GOOGLE_OAUTH_CLIENT_ID
  client_secret_env: GOOGLE_OAUTH_CLIENT_SECRET
  credentials_help:
    text: "1. 创建 Google Cloud 项目；2. 启用 Gmail API（API 和服务 → 库 → Gmail API → 启用）；3. 创建 OAuth 2.0 凭据（API 和服务 → 凭据 → 创建 → OAuth 客户端 ID）；4. 将回调 URL 设置为 http://localhost:8585/callback；5. 若应用处于测试模式，请在 OAuth 权限请求页面中把你的邮箱添加为测试用户"
    url: https://console.cloud.google.com/apis/credentials
templates:
  dir: templates
  format: md
