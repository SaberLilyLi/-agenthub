server {
  listen 80;
  server_name _;
  client_max_body_size 210m;
  location / { return 301 https://$host$request_uri; }
}
server {
  listen 443 ssl http2;
  server_name example.com;
  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  client_max_body_size 210m;
  location /_next/static/ { proxy_pass http://127.0.0.1:3102; expires 30d; add_header Cache-Control "public, immutable"; }
  location ~ ^/(me|api/auth) { proxy_pass http://127.0.0.1:3102; add_header Cache-Control "no-store"; }
  location / { proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_pass http://127.0.0.1:3102; }
}
