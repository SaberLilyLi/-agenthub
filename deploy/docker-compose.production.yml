services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SERVER_URL: https://${DOMAIN:?DOMAIN must be set in deploy/.env.production}
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URI: postgresql://agenthub:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/agenthub
      NEXT_PUBLIC_SERVER_URL: https://${DOMAIN:?DOMAIN must be set in deploy/.env.production}
      PAYLOAD_SECRET_FILE: /run/secrets/payload_secret
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - agenthub_media:/app/media
      - ../secrets/payload_secret:/run/secrets/payload_secret:ro
    restart: unless-stopped

  # Run manually before starting a new app version:
  # docker compose -f deploy/docker-compose.production.yml --env-file deploy/.env.production --profile tools run --rm migrate
  migrate:
    profiles: [tools]
    build:
      context: ..
      dockerfile: Dockerfile
      target: builder
      args:
        NEXT_PUBLIC_SERVER_URL: https://${DOMAIN:?DOMAIN must be set in deploy/.env.production}
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URI: postgresql://agenthub:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/agenthub
      PAYLOAD_SECRET_FILE: /run/secrets/payload_secret
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../secrets/payload_secret:/run/secrets/payload_secret:ro
    command: pnpm payload migrate

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agenthub
      POSTGRES_USER: agenthub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in deploy/.env.production}
    volumes:
      - agenthub_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agenthub -d agenthub']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set in deploy/.env.production}
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  agenthub_postgres:
  agenthub_media:
  caddy_data:
  caddy_config:
